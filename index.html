<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaign Planner</title>
</head>

<body>
    <img src="logo.png" alt="Logo vom Campaign Planner" width="200" height="200">
    <h1>Campaign Planner</h1>
    <h3>Funktionen</h2>
    <ol>
        <li>Kampagnen erstellen </li>
        <li>Status verfolgen</li>
        <li>Kalenderansicht</li>
    </ol>
    <table>
        <h3>Preise</h3>
        <tr>
            <th>Paket </th>
            <th>Preis</th>
        </tr>
        <tr>
            <td>Basis</td>
            <td> 9,99 €</td>
        </tr>
        <tr>
            <td>Team</td>
            <td> 19,99 €</td>
        </tr>
        <tr>
            <td>Pro</td>
            <td> 29,99 €</td>
        </tr>
    </table>
    <form>
        <h3>Kontaktformular</h3>
        <p>
            <label for="name">Dein Name:</label>
            <input type="text" id="name" name="name">
        </p>
        <p>
            <label for="email"> Deine E-Mail:</label>
            <input type="email" id="email" name="email">
        </p>
        <p>

            <label for="budget">Dein Budget:</label>
            <input type="number" id="budget" name="budget">

        </p>
        <p>
            <label for="nachricht">Deine Nachricht:</label>
            <textarea id="nachricht" name="nachricht" rows="5" cols="40"></textarea>
        </p>
        <p>
            <button type="submit">Absenden</button>
        </p>

    </form>
</body>

</html>
