<!DOCTYPE html>
<html lang="de">

<head>
    <title>Kalender</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <h2>Meine To-dos</h2>
            <ul>
                <li>Beispiel-To-do 1</li>
                <li>Beispiel-To-do 2</li>
                <li>Beispiel-To-do 3</li>
            </ul>
            <button id="submit" type="submit">Neuer Termin</button>
        </aside>
        <main class="main">
            <button id="prev-month">←</button>
            <button id="next-month">→</button>
            <h1></h1>
            <div class="calendar-header">
                <span>Mo</span>
                <span>Di</span>
                <span>Mi</span>
                <span>Do</span>
                <span>Fr</span>
                <span>Sa</span>
                <span>So</span>
            </div>
            <div class="calendar-grid"></div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
